<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="event-title">Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>
    <button id="show-program" type="button">Показать программу</button>
    <div id="program" hidden></div>
    <form id="service-form">
        <label><input type="checkbox" id="guide"> Экскурсия с гидом </label><br>
        <label><input type="checkbox" id="audio"> Аудиогид</label><br>
        <label><input type="checkbox" id="catalog"> Каталог выставки</label><br>
        <button type="submit">Рассчитать</button>
  </form>

  <p id="choice-error" hidden>Выберите хотя бы одну услугу.</p>
  <p id="data-error" hidden>Ошибка данных.</p>

  <div id="result" hidden></div>
  <pre id="report-json" hidden></pre>

  <script src="app.js"></script>
</body>
</html>
